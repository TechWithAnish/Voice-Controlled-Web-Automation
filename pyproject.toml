[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-web-automation"
version = "2.1.0"
description = "Hands-free web browsing driven by spoken commands, in Chrome, Edge, Brave or Firefox."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anish Rout" }]
keywords = ["voice", "speech-recognition", "selenium", "automation", "accessibility", "browser"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Adaptive Technologies",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "selenium>=4.15,<5",
    "SpeechRecognition>=3.10,<4",
    "rapidfuzz>=3.5,<4",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "pyttsx3>=2.90,<3",
]

[project.optional-dependencies]
# PyAudio needs a compiler and portaudio headers, so it is kept out of the
# default install: --text mode and the test suite work without it.
mic = ["PyAudio>=0.2.13"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "lxml>=5.0",          # validates generated XPath in the test suite
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/TechWithAnish/Voice-Controlled-Web-Automation"
Issues = "https://github.com/TechWithAnish/Voice-Controlled-Web-Automation/issues"

[project.scripts]
voice-automation = "voice_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_automation = ["py.typed"]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# examples/ holds unsupported legacy scripts; collecting them would launch a
# real browser and hit the network.
testpaths = ["tests"]
norecursedirs = ["examples", ".git", "build", "dist", "*.egg-info", "venv", ".venv"]
# Live-browser tests are opt-in: run them with `pytest -m browser`.
addopts = "-ra --strict-markers --strict-config -m 'not browser'"
markers = [
    "browser: integration tests that drive a real Chrome instance",
]
filterwarnings = ["error::DeprecationWarning:voice_automation.*"]

[tool.coverage.run]
source = ["voice_automation"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear
    "C4",        # comprehensions
    "UP",        # pyupgrade
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ARG",       # unused arguments
    "PTH",       # prefer pathlib
    "RET",       # return consistency
    "S",         # bandit security rules
]
ignore = [
    "S101",    # assert is used by the test suite
    # Smart quotes are handled deliberately in the parser and its tests.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005", "S105", "S106"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src/voice_automation"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
